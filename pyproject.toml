[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gov-survey-redact"
version = "0.1.0"
description = "Deterministic-first PII and organisational re-identification redaction pipeline for Australian Government survey responses (local batch and PySpark)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
nlp = ["spacy>=3.7"]
spark = ["pyspark>=3.4", "pandas>=2.0", "pyarrow>=12.0"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
gov-survey-redact = "gov_survey_redact.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gov_survey_redact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
